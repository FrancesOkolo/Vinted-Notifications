{% extends "base.html" %}

{% block title %}Logs - Vinted Notifications{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap align-items-center gap-2 pt-3 pb-2 mb-3 border-bottom logs-page-heading">
    <h1 class="h2">Logs</h1>
    <div class="d-flex flex-wrap gap-2 logs-refresh-actions">
        <button type="button" class="btn btn-sm btn-outline-secondary" id="refreshBtn">
            <i class="bi bi-arrow-clockwise me-1" aria-hidden="true"></i> Refresh Now
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="toggleAutoRefreshBtn" data-state="on">
            <i class="bi bi-play-circle me-1" aria-hidden="true"></i> Auto-Refresh: ON
        </button>
    </div>
</div>

<section class="card mb-3" aria-labelledby="logFiltersTitle">
    <div class="card-header d-flex align-items-center">
        <i class="bi bi-funnel me-2 text-info" aria-hidden="true"></i>
        <h2 class="h5 card-title mb-0" id="logFiltersTitle">Find log entries</h2>
    </div>
    <div class="card-body">
        <div class="row g-3 align-items-end">
            <div class="col-lg-5 col-md-6">
                <label class="form-label fw-semibold" for="logSearchInput">Search logs</label>
                <div class="input-group">
                    <span class="input-group-text" aria-hidden="true"><i class="bi bi-search"></i></span>
                    <input type="search" class="form-control" id="logSearchInput"
                           placeholder="Error text, URL, timestamp..." autocomplete="off">
                    <button type="button" class="btn btn-outline-secondary" id="clearLogSearch"
                            aria-label="Clear log search" title="Clear log search" hidden>
                        <i class="bi bi-x-lg" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <div class="col-lg-3 col-md-6">
                <label class="form-label fw-semibold" for="logModuleInput">Module</label>
                <input type="search" class="form-control" id="logModuleInput" list="logModuleOptions"
                       placeholder="All modules" autocomplete="off">
                <datalist id="logModuleOptions"></datalist>
            </div>
            <div class="col-lg-2 col-md-6">
                <label class="form-label fw-semibold" for="logLevelFilter">Level</label>
                <select class="form-select" id="logLevelFilter">
                    <option value="all">All levels</option>
                    <option value="DEBUG">Debug</option>
                    <option value="INFO">Info</option>
                    <option value="WARNING">Warning</option>
                    <option value="ERROR">Error</option>
                    <option value="CRITICAL">Critical</option>
                </select>
            </div>
            <div class="col-lg-2 col-md-6">
                <div class="form-check form-switch log-routine-toggle">
                    <input class="form-check-input" type="checkbox" role="switch" id="hideRoutineHttp" checked>
                    <label class="form-check-label" for="hideRoutineHttp">Hide routine web requests</label>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="card" aria-labelledby="logEntriesTitle">
    <div class="card-header d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <i class="bi bi-journal-text me-2 text-info" aria-hidden="true"></i>
            <h2 class="h5 card-title mb-0" id="logEntriesTitle">Log Entries</h2>
        </div>
        <span class="badge bg-secondary" id="logCount" aria-live="polite">Loading...</span>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive d-none d-md-block">
            <table class="table table-hover mb-0 logs-table">
                <thead>
                <tr>
                    <th scope="col">Timestamp</th>
                    <th scope="col">Level</th>
                    <th scope="col">Module</th>
                    <th scope="col">Message</th>
                </tr>
                </thead>
                <tbody id="logEntries">
                <tr><td colspan="4" class="text-center py-4">Loading logs...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="d-md-none log-card-list" id="logCards">
            <p class="text-center text-muted py-4 mb-0">Loading logs...</p>
        </div>
    </div>
    <div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2">
        <span class="text-muted small">Log file: logs/vinted.log</span>
        <button class="btn btn-sm btn-outline-primary" id="loadMoreBtn">
            <i class="bi bi-arrow-down-circle me-1" aria-hidden="true"></i> Load 50 more
        </button>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
    document.addEventListener('DOMContentLoaded', function () {
        const logEntries = document.getElementById('logEntries');
        const logCards = document.getElementById('logCards');
        const logCount = document.getElementById('logCount');
        const refreshBtn = document.getElementById('refreshBtn');
        const toggleAutoRefreshBtn = document.getElementById('toggleAutoRefreshBtn');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const searchInput = document.getElementById('logSearchInput');
        const clearSearch = document.getElementById('clearLogSearch');
        const moduleInput = document.getElementById('logModuleInput');
        const moduleOptions = document.getElementById('logModuleOptions');
        const levelFilter = document.getElementById('logLevelFilter');
        const hideRoutineHttp = document.getElementById('hideRoutineHttp');

        const limit = window.matchMedia('(max-width: 767.98px)').matches ? 25 : 50;
        loadMoreBtn.innerHTML = `<i class="bi bi-arrow-down-circle me-1" aria-hidden="true"></i> Load ${limit} more`;
        let currentOffset = 0;
        let renderedCount = 0;
        let totalMatches = 0;
        let autoRefreshInterval;
        let searchTimer;

        function setEmptyState(message, isError = false) {
            logEntries.textContent = '';
            const row = document.createElement('tr');
            const cell = document.createElement('td');
            cell.colSpan = 4;
            cell.className = `text-center py-4${isError ? ' text-danger' : ''}`;
            cell.textContent = message;
            row.appendChild(cell);
            logEntries.appendChild(row);

            logCards.textContent = '';
            const mobileMessage = document.createElement('p');
            mobileMessage.className = `text-center py-4 mb-0${isError ? ' text-danger' : ' text-muted'}`;
            mobileMessage.textContent = message;
            logCards.appendChild(mobileMessage);
        }

        function levelClass(level) {
            if (level === 'ERROR' || level === 'CRITICAL') return 'danger';
            if (level === 'WARNING') return 'warning text-dark';
            if (level === 'INFO') return 'primary';
            return 'secondary';
        }

        function appendTableRow(log) {
            const row = document.createElement('tr');
            if (log.level === 'ERROR' || log.level === 'CRITICAL') row.classList.add('table-danger');
            if (log.level === 'WARNING') row.classList.add('table-warning');

            const timestampCell = document.createElement('td');
            timestampCell.className = 'log-timestamp';
            timestampCell.textContent = log.timestamp;

            const levelCell = document.createElement('td');
            const levelBadge = document.createElement('span');
            levelBadge.className = `badge text-bg-${levelClass(log.level)}`;
            levelBadge.textContent = log.level;
            levelCell.appendChild(levelBadge);

            const moduleCell = document.createElement('td');
            moduleCell.textContent = log.module;

            const messageCell = document.createElement('td');
            messageCell.className = 'log-entry';
            messageCell.textContent = log.message;

            row.append(timestampCell, levelCell, moduleCell, messageCell);
            logEntries.appendChild(row);
        }

        function appendMobileCard(log) {
            const article = document.createElement('article');
            article.className = 'log-mobile-card';

            const heading = document.createElement('div');
            heading.className = 'd-flex justify-content-between align-items-start gap-2';
            const meta = document.createElement('div');
            const timestamp = document.createElement('time');
            timestamp.className = 'd-block fw-semibold small';
            timestamp.textContent = log.timestamp;
            const module = document.createElement('span');
            module.className = 'd-block text-muted small text-break';
            module.textContent = log.module;
            meta.append(timestamp, module);
            const badge = document.createElement('span');
            badge.className = `badge text-bg-${levelClass(log.level)}`;
            badge.textContent = log.level;
            heading.append(meta, badge);

            const details = document.createElement('details');
            details.className = 'mt-2';
            const summary = document.createElement('summary');
            summary.textContent = 'View message';
            const message = document.createElement('pre');
            message.className = 'log-entry mt-2 mb-0';
            message.textContent = log.message;
            details.append(summary, message);

            article.append(heading, details);
            logCards.appendChild(article);
        }

        function updateModuleSuggestions(logs) {
            const known = new Set(Array.from(moduleOptions.options).map(option => option.value));
            logs.forEach(log => known.add(log.module));
            moduleOptions.textContent = '';
            Array.from(known).sort().forEach(module => {
                const option = document.createElement('option');
                option.value = module;
                moduleOptions.appendChild(option);
            });
        }

        function buildLogUrl(offset) {
            const params = new URLSearchParams({
                offset: String(offset),
                limit: String(limit),
                level: levelFilter.value,
                search: searchInput.value.trim(),
                module: moduleInput.value.trim(),
                hide_http: hideRoutineHttp.checked ? '1' : '0'
            });
            return `/api/logs?${params.toString()}`;
        }

        async function fetchLogs(offset = 0, append = false) {
            refreshBtn.disabled = true;
            try {
                const response = await fetch(buildLogUrl(offset));
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Could not load logs');

                if (!append) {
                    logEntries.textContent = '';
                    logCards.textContent = '';
                    currentOffset = 0;
                    renderedCount = 0;
                }

                totalMatches = data.total;
                if (!data.logs.length && !append) {
                    setEmptyState('No log entries match these filters.');
                } else {
                    data.logs.forEach(log => {
                        appendTableRow(log);
                        appendMobileCard(log);
                    });
                    renderedCount += data.logs.length;
                    updateModuleSuggestions(data.logs);
                }

                logCount.textContent = `${renderedCount} of ${totalMatches}`;
                loadMoreBtn.disabled = renderedCount >= totalMatches;
                loadMoreBtn.hidden = totalMatches === 0;
            } catch (error) {
                console.error('Error fetching logs:', error);
                setEmptyState('Error loading logs.', true);
                logCount.textContent = 'Unavailable';
                loadMoreBtn.disabled = true;
            } finally {
                refreshBtn.disabled = false;
            }
        }

        function refreshFilteredLogs() {
            clearSearch.hidden = searchInput.value.length === 0;
            fetchLogs();
        }

        function debounceRefresh() {
            window.clearTimeout(searchTimer);
            searchTimer = window.setTimeout(refreshFilteredLogs, 300);
        }

        function startAutoRefresh() {
            window.clearInterval(autoRefreshInterval);
            autoRefreshInterval = window.setInterval(function () {
                if (!document.hidden) fetchLogs();
            }, 15000);
        }

        refreshBtn.addEventListener('click', () => fetchLogs());
        loadMoreBtn.addEventListener('click', function () {
            currentOffset = renderedCount;
            fetchLogs(currentOffset, true);
        });
        searchInput.addEventListener('input', debounceRefresh);
        moduleInput.addEventListener('input', debounceRefresh);
        levelFilter.addEventListener('change', refreshFilteredLogs);
        hideRoutineHttp.addEventListener('change', refreshFilteredLogs);
        clearSearch.addEventListener('click', function () {
            searchInput.value = '';
            refreshFilteredLogs();
            searchInput.focus();
        });

        toggleAutoRefreshBtn.addEventListener('click', function () {
            const turningOff = this.dataset.state === 'on';
            this.dataset.state = turningOff ? 'off' : 'on';
            this.innerHTML = turningOff
                ? '<i class="bi bi-pause-circle me-1" aria-hidden="true"></i> Auto-Refresh: OFF'
                : '<i class="bi bi-play-circle me-1" aria-hidden="true"></i> Auto-Refresh: ON';
            if (turningOff) {
                window.clearInterval(autoRefreshInterval);
            } else {
                startAutoRefresh();
                fetchLogs();
            }
        });

        fetchLogs();
        startAutoRefresh();
    });
</script>
{% endblock %}
