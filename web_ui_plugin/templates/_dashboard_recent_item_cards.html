{% for item in items %}
<div class="col-6 col-md-6 col-xl-4 mb-3">
    <div class="card h-100">
        {% if item.photo_url %}
        <img src="{{ item.photo_url }}" class="card-img-top" alt="{{ item.title }}"
             data-image-fallback style="height: 150px; object-fit: cover;">
        {% else %}
        <div class="card-img-top bg-light d-flex align-items-center justify-content-center"
             style="height: 150px;">
            <i class="bi bi-image text-muted" style="font-size: 2rem;"></i>
        </div>
        {% endif %}
        <div class="card-body p-2">
            <h6 class="card-title" style="height: 40px; overflow: hidden; font-size: 0.9rem;">
                <strong>{{ item.title }}</strong>
            </h6>
            <p class="card-text small mb-1">
                Price: {{ item.price }} {{ item.currency }}<br>
                Found:
                <time datetime="{{ item.timestamp_iso }}"
                      data-relative-time="{{ item.timestamp_raw }}"
                      title="{{ item.timestamp }}">{{ item.timestamp }}</time><br>
                Listed:
                <time datetime="{{ item.listed_timestamp_iso }}"
                      data-relative-time="{{ item.listed_timestamp_raw }}"
                      title="{{ item.listed_timestamp }}">{{ item.listed_timestamp }}</time>
            </p>
        </div>
        <div class="card-footer bg-white p-2">
            <a href="{{ item.url }}" target="_blank" class="btn btn-sm btn-primary w-100">
                <i class="bi bi-box-arrow-up-right"></i> View
            </a>
        </div>
    </div>
</div>
{% else %}
<div class="col-12 text-center py-5">
    <p class="text-muted">No items found</p>
</div>
{% endfor %}
