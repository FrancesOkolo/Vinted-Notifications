{% for item in items %}
<tr>
    <td style="width: 60px;">
        {% if item.photo_url %}
        <img src="{{ item.photo_url }}" alt="{{ item.title }}" class="img-thumbnail"
             data-image-fallback style="width: 50px; height: 50px; object-fit: cover;">
        {% else %}
        <div class="bg-light d-flex align-items-center justify-content-center"
             style="width: 50px; height: 50px;">
            <i class="bi bi-image text-muted"></i>
        </div>
        {% endif %}
    </td>
    <td>{{ item.title }}</td>
    <td>{{ item.price }} {{ item.currency }}</td>
    <td>
        <time datetime="{{ item.timestamp_iso }}"
              data-relative-time="{{ item.timestamp_raw }}"
              title="{{ item.timestamp }}">{{ item.timestamp }}</time>
    </td>
    <td>
        <time datetime="{{ item.listed_timestamp_iso }}"
              data-relative-time="{{ item.listed_timestamp_raw }}"
              title="{{ item.listed_timestamp }}">{{ item.listed_timestamp }}</time>
    </td>
    <td>
        <a href="{{ item.url }}" target="_blank" class="btn btn-sm btn-outline-primary">
            <i class="bi bi-box-arrow-up-right"></i> View
        </a>
    </td>
</tr>
{% else %}
<tr>
    <td colspan="6" class="text-center">No items found</td>
</tr>
{% endfor %}
